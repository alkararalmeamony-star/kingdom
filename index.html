<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المملكة 👑 | المتجر الفاخر</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
body{background:#0a0a0a;color:#fff;overflow-x:hidden}
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background: radial-gradient(circle at top, #1a1a1a, #000);padding:20px}
.hero h1{font-size:3.5rem;font-weight:900;background:linear-gradient(90deg,#FFD700,#FFA500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:15px}
.hero p{color:#aaa;font-size:1.2rem;margin-bottom:30px}
.btn{padding:16px 40px;background:linear-gradient(90deg,#FFD700,#FFA500);color:#000;border:none;border-radius:50px;font-weight:900;font-size:1.1rem;cursor:pointer;transition:.3s}
.btn:hover{transform:scale(1.05);box-shadow:0 10px 30px rgba(255,215,0,.3)}
.products{padding:60px 20px;max-width:1200px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:30px}
.card{background:#111;border:1px solid #222;border-radius:20px;padding:20px;text-align:center;transition:.3s}
.card:hover{border-color:#FFD700;transform:translateY(-5px)}
.card img{width:100%;height:200px;object-fit:cover;border-radius:15px;background:#222}
.card h3{margin:15px 0 5px}
.card span{color:#FFD700;font-weight:700}
footer{text-align:center;padding:30px;color:#555;border-top:1px solid #111;margin-top:60px}
</style>
</head>
<body>
<section class="hero">
<div>
<h1>👑 مملكة الفخامة</h1>
<p>أفخم المنتجات المختارة بعناية لك - شحن مجاني لجميع مناطق المملكة</p>
<button class="btn" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">تسوق الآن</button>
</div>
</section>

<section class="products" id="shop">
<h2 style="text-align:center;font-size:2rem">🔥 منتجاتنا الأكثر مبيعاً</h2>
<div class="grid">
<div class="card">
<img src="https://via.placeholder.com/400x300/111/FFD700?text=Product+1">
<h3>ساعة ملكية فاخرة</h3>
<span>299 ر.س</span><br><br>
<button class="btn" style="padding:10px 20px;font-size:.9rem">اطلب الآن عبر واتساب</button>
</div>
<div class="card">
<img src="https://via.placeholder.com/400x300/111/FFD700?text=Product+2">
<h3>عطر ملكي أصلي</h3>
<span>199 ر.س</span><br><br>
<button class="btn" style="padding:10px 20px;font-size:.9rem">اطلب الآن عبر واتساب</button>
</div>
<div class="card">
<img src="https://via.placeholder.com/400x300/111/FFD700?text=Product+3">
<h3>محفظة جلد طبيعي</h3>
<span>149 ر.س</span><br><br>
<button class="btn" style="padding:10px 20px;font-size:.9rem">اطلب الآن عبر واتساب</button>
</div>
</div>
</section>

<footer>© 2026 مملكة الفخامة - جميع الحقوق محفوظة</footer>

<script>
// ضع رقم واتسابك هنا
const whatsappNumber = "989014446690";
document.querySelectorAll('.card .btn').forEach(btn=>{
btn.addEventListener('click',()=>{
const product = btn.parentElement.querySelector('h3').innerText;
window.open(`https://wa.me/${whatsappNumber}?text=مرحبا، أريد طلب: ${product}`,'_blank')
})
})
</script>
</body>
</html>
