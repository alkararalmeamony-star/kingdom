<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 مملكة الأساطير - صنعاء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#000;color:#fff}
.header{padding:40px 20px;text-align:center;background:radial-gradient(circle at center,#222 0%,#000 70%);border-bottom:2px solid #FFD700}
.header h1{font-size:42px;color:#FFD700;text-shadow:0 0 20px #FFD700,0 0 40px #FFA500}
.header p{margin-top:15px;font-size:20px;color:#ccc}
.hero{padding:30px 20px;text-align:center}
.hero .badge{display:inline-block;background:linear-gradient(45deg,#FFD700,#FFA500);color:#000;padding:10px 25px;border-radius:50px;font-weight:900;font-size:18px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:20px;max-width:1100px
